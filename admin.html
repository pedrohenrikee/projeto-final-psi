<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Adega Vinho & Cia - Admin</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header class="topo">
        <h1>🍷 Painel <span>Administrativo</span></h1>
        <a href="index.html">← Voltar à Vitrine</a>
    </header>

    <main class="painel">
        <form class="cadastro" id="form">
            <h2 id="tituloForm">Novo Vinho</h2>
            <input type="hidden" id="id">

            <label>Nome <input id="nome" required></label>
            <div class="linha">
        <label>Tipo
          <select id="tipo" required>
            <option value="">Selecione</option>
            <option>Vinho Tinto</option>
            <option>Vinho Branco</option>
            <option>Rosé</option>
            <option>Espumante</option>
            <option>Liquoroso</option>
            <option>Fortificado</option>
          </select>
        </label>
        <label>Ano <input id="ano" type="number" min="1900" max="2100" required></label>
      </div>
      <div class="linha">
        <label>País <input id="pais" required></label>
        <label>Região <input id="regiao" required></label>
      </div>
      <div class="linha">
        <label>Uva <input id="uva"></label>
        <label>Teor alcoólico (%) <input id="teor" type="number" step="0.1" min="0" max="25"></label>
      </div>
      <div class="linha">
        <label>Preço (R$) <input id="preco" type="number" step="0.01" min="0" required></label>
        <label>Estoque <input id="estoque" type="number" min="0" step="1" required></label>
      </div>
        <label>Características (separadas por vírgula) <input id="caracteristicas" placeholder="frutado, encorpado"></label>
        <label>Descrição <textarea id="descricao" rows="3"></textarea></label>
        <label>Imagem (URL pública)
        <input id="imagem" type="url" placeholder="https://res.cloudinary.com/...">
        </label>
        <label>Ou envie uma imagem do seu computador
        <input id="arquivo" type="file" accept="image/*">
        </label>
        <img id="preview" class="preview-img" alt="" hidden>

        <button class="btn primario" type="submit" id="btnSalvar">Salvar</button>
        <button class="btn sec" type="button" id="btnCancelar" hidden>Cancelar edição</button>
        </form>
        
        <section>
            <div class="filtros">
                <input type="search" id="buscaAdmin" placeholder="Buscar na lista...">
            </div>
            <p class="msg" id="mensagem">Carregando...</p>
            <div class="tabela-wrap">
                <table>
                    <thead>
                        <tr>
                            <th>Foto</th>
                            <th>Vinho</th>
                            <th>Preço</th>
                            <th>Estoque</th>
                            <th>Ações</th>
                        </tr>
                    </thead>
                    <tbody id="corpo"></tbody>
                </table>
            </div>
        </section>

    </main>

    <div class="toast" id="toast"></div>

    <script src="config.js"></script>
    <script src="api.js"></script>
    <script src="cloudinary.js"></script>
    <script src="admin.js"></script>
</body>
</html>
