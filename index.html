<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Adega Vinho & Cia — Vitrine</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="topo">
    <h1>🍷 Adega <span>Vinho & Cia</span></h1>
    <a href="admin.html">Painel administrativo →</a>
  </header>

  <main>
    <section class="filtros">
        <input type="search" id="busca" placeholder="Buscar por nome, país, região ou característica...">
    </section>

    <section class="grade" id="grade"></section>
    <p class="msg" id="mensagem">Carregando vinhos... (a API pode levar alguns segundos para acordar)</p>
  </main>

  <dialog id="modal">
    <button class="fechar" id="fecharModal" aria-label="Fechar">&times;</button>
    <div class="detalhe" id="detalhe"></div>
  </dialog>

  <script src="config.js"></script>
  <script src="api.js"></script>
  <script src="vitrine.js"></script>
</body>
</html>
